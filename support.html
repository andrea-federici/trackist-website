<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrideBuddy Support</title>
  <meta name="description" content="Get help with StrideBuddy, report a problem, or share feedback about the app.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F8F8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120E">
  <link rel="icon" type="image/png" href="assets/stridebuddy_icon.png">
  <style>
    :root {
      --paper:#F8F8F8; --paper-2:#FFFFFF; --card:#FFFFFF;
      --ink:#0C0B0A; --ink-2:#524C46; --ink-3:#6F655E; --rule:#E9DED6;
      --accent:#DB2412; --accent-dark:#B52B20; --accent-soft:#FDE5DF;
      --header-bg:rgba(248,248,248,.85); --card-border:rgba(12,11,10,.10);
      --shadow-card:0 1px 2px rgba(12,11,10,.04),0 8px 24px rgba(12,11,10,.06);
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --paper:#16120E; --paper-2:#201A14; --card:#261F18;
        --ink:#F7F0E7; --ink-2:#DCD1C3; --ink-3:#B5A999; --rule:#463A2E;
        --accent:#DB2412; --accent-dark:#FFA697; --accent-soft:#40231D;
        --header-bg:rgba(22,18,14,.85); --card-border:rgba(247,240,231,.10);
        --shadow-card:0 1px 2px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.18);
      }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.65; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:680px; margin:0 auto; padding:0 22px; }
    .topbar { border-bottom:1px solid var(--rule); background:var(--header-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    .topbar .wrap { display:flex; align-items:center; height:64px; }
    .topbar img { height:24px; }
    main { padding:48px 0 72px; }
    h1 { font-family:var(--sans); font-weight:600; font-size:38px; line-height:1.1; letter-spacing:-.025em; margin:0 0 8px; }
    .eyebrow { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-dark); margin:0 0 14px; }
    p { color:var(--ink-2); font-size:16.5px; }
    .card { background:var(--card); border:1px solid var(--card-border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-card); margin:24px 0; }
    .card h2 { font-family:var(--sans); font-weight:600; font-size:20px; letter-spacing:-.015em; margin:0 0 8px; }
    .card p { margin:0; }
    a { color:var(--accent-dark); font-weight:600; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .mail { display:inline-block; margin-top:6px; font-size:17px; }
    .back { display:inline-block; margin-top:28px; color:var(--ink-3); font-weight:600; }
    .back:hover { color:var(--ink); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap"><a href="index.html" aria-label="StrideBuddy home"><picture><source media="(prefers-color-scheme: dark)" srcset="assets/stridebuddy_lockup_dark.png"><img src="assets/stridebuddy_lockup.png" alt="StrideBuddy"></picture></a></div>
  </header>
  <main>
    <div class="wrap">
      <p class="eyebrow">Support</p>
      <h1>Need a hand with StrideBuddy?</h1>
      <p>If something isn’t working, or if you have an idea for the app, send us a note. Feedback from athletes and coaches helps us decide what to fix and build next.</p>

      <div class="card">
        <h2>Contact</h2>
        <p>For help, bug reports, or feedback, email:</p>
        <a class="mail" href="mailto:support@stridebuddy.app?subject=StrideBuddy%20support">support@stridebuddy.app</a>
      </div>

      <a class="back" href="index.html">← Back to home</a>
    </div>
  </main>
</body>
</html>
